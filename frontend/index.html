<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>countrycounter — monospace</title>
        <link rel="stylesheet" href="css/monospace.css" />
        <link rel="stylesheet" href="css/style.css" />

        <script
            src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"
            integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i"
            crossorigin="anonymous"
        ></script>
        <script
            src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"
            integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67"
            crossorigin="anonymous"
        ></script>
    </head>
    <body>
        <div class="app" data-screen-label="Country Counter">
            <div class="app-header">
                <div class="brand">
                    <span class="bracket">[</span>countrycounter<span class="bracket">]</span>
                </div>
                <div class="meta">
                    <span class="meta-version">v0.4</span>
                    <span>· LIVE</span>
                </div>
            </div>

            <div class="qa">
                <button id="add-focus-btn" type="button" title="Add country">
                    <span class="glyph">+</span>
                    <span>add</span>
                </button>
                <button id="toggle-list-btn" type="button" title="Toggle list">
                    <span class="glyph">▮</span>
                    <span class="qa-label">hide list</span>
                </button>
                <button id="sort-cycle-btn" type="button" title="Sort">
                    <span class="glyph">↓</span>
                    <span class="qa-label">sort: recent</span>
                </button>
                <button id="share-btn" type="button" title="Export to clipboard">
                    <span class="glyph">↗</span>
                    <span>share</span>
                </button>
            </div>

            <div class="hero">
                <div class="hero-marker">§ STATUS · 01</div>
                <div class="row">
                    <span id="visited-count" class="big t-num">00</span>
                    <span class="slash">/</span>
                    <span id="visited-denom" class="denom t-num">195</span>
                </div>
                <div class="caption">
                    <span id="visited-pct" class="strong">0%</span> OF EARTH ·
                    <span id="visited-remaining">195 remaining</span>
                </div>
                <div id="progress-cells" class="progress" aria-label="0% complete"></div>
            </div>

            <div class="map-wrap" style="height: 252px;">
                <svg id="world" class="world" viewBox="0 0 800 460" preserveAspectRatio="xMidYMid meet"></svg>
                <div class="map-corner tl">EQUAL EARTH · 1:155M</div>
                <div id="map-corner-tr" class="map-corner tr">0/195 · 0%</div>
                <div id="last-added" class="last-added" hidden>
                    <span class="arrow">→</span><span id="last-added-text">LAST · </span>
                </div>
            </div>

            <div class="actions">
                <div class="combo">
                    <div id="suggest" class="suggest" hidden></div>
                    <span class="prefix">›</span>
                    <input
                        id="country-input"
                        type="text"
                        class="with-prefix"
                        placeholder="search country..."
                        spellcheck="false"
                        autocomplete="off"
                    />
                    <button id="clear-query-btn" class="clear" type="button" aria-label="Clear" hidden>×</button>
                </div>
                <button id="add-country-btn" class="btn primary" type="button" disabled>
                    + Add
                </button>
            </div>

            <div id="drawer" class="drawer">
                <div id="continents" class="continents"></div>

                <div class="drawer-head">
                    <div class="title">§ VISITED</div>
                    <div id="drawer-count" class="count">0 ENTRIES · SORT: RECENT</div>
                </div>

                <div class="row-toolbar">
                    <div id="sort-seg" class="seg">
                        <button type="button" data-sort="recent" class="on">recent</button>
                        <button type="button" data-sort="alpha">A&ndash;Z</button>
                        <button type="button" data-sort="continent">region</button>
                    </div>
                    <div class="row-toolbar-spacer"></div>
                    <button id="clear-all-btn" class="btn ghost row-toolbar-clear" type="button" hidden>clear</button>
                </div>

                <div id="countries-ul"></div>
            </div>

            <div id="toast" class="toast" hidden>
                <span id="toast-glyph" class="glyph">✓</span>
                <span id="toast-text"></span>
            </div>
        </div>

        <script src="https://telegram.org/js/telegram-web-app.js"></script>
        <script src="js/world-map.js"></script>
        <script src="js/app.js"></script>
    </body>
</html>
